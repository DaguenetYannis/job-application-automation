profile_summary:
fr: >
Data analyst et économiste junior spécialisé dans l'analyse quantitative, la structuration de données,
la construction d'indicateurs et la production de restitutions décisionnelles. Expérience en SQL, Python,
R, Power BI, Excel avancé, Power Query et automatisation de workflows pour transformer des données
hétérogènes en analyses exploitables par des équipes métier, des acteurs publics et des clients non techniques.
en: >
Junior data analyst and economist specialized in quantitative analysis, data structuring, KPI development,
and decision-oriented reporting. Experience with SQL, Python, R, Power BI, advanced Excel, Power Query,
and workflow automation to turn heterogeneous datasets into actionable insights for business teams,
public-sector stakeholders, and non-technical clients.

